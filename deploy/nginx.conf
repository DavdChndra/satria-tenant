# Konfigurasi reverse proxy Nginx untuk SATRIA 2026.
#
# Pasang:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/satria-tenant
#   sudo ln -s /etc/nginx/sites-available/satria-tenant /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ganti "domain-anda.com" dan path /home/deploy/satria-tenant sesuai VPS.
# Setelah ini jalan di HTTP, pasang HTTPS dengan:
#   sudo certbot --nginx -d domain-anda.com -d www.domain-anda.com

server {
    listen 80;
    server_name domain-anda.com www.domain-anda.com;

    # Samakan dengan MAX_CONTENT_LENGTH di app.py (5 MB) + sedikit ruang.
    client_max_body_size 6M;

    location /static/ {
        alias /home/deploy/satria-tenant/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

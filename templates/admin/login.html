<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login admin — SATRIA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-login-body">
<div class="admin-login-card">
  <div class="brand"><div class="brand-mark"><span>S</span></div>SATRIA 2026</div>
  <h1>Login admin</h1>
  <p class="admin-login-sub">Masuk untuk mengelola pendaftaran tenant.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-list">{% for category, m in messages %}<div class="flash-msg flash-{{ category }}">{{ m }}</div>{% endfor %}</div>
    {% endif %}
  {% endwith %}
  <form method="POST" class="admin-login-form">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-primary btn-block">Masuk</button>
  </form>
  <a href="{{ url_for('index') }}" class="admin-login-back">&larr; Kembali ke halaman pendaftaran</a>
</div>
</body>
</html>
